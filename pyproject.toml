[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-ai-workbench"
version = "0.1.0"
description = "Local WeChat AI reply daemon and conversation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "jinja2>=3.1.6,<4", "httpx>=0.27,<1", "keyring>=25,<26", "pillow>=11,<13",
]

[project.optional-dependencies]
desktop = ["pywebview>=6,<7"]
dev = ["build>=1,<2"]

[project.scripts]
wechat-ai = "wechat_ai_cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["wechat_ai_cli", "wechat_ai_paths", "wechat_ai_reply", "wechat_ai_daemon", "wechat_ai_console", "wechat_ai_desktop"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["wechat_ai_control*"]

[tool.setuptools.package-data]
wechat_ai_control = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js", "web/static/js/vendor/*.js", "web/static/js/vendor/LICENSE.*"]
